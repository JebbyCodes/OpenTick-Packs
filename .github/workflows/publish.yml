# When a pull request is merged: check everything once more and publish. The website, index.json (every pack and its code) and every pack file
# go to GitHub Pages, which is where OpenTick looks. Nothing is published unless every pack passes, so a bad merge leaves the last good version up.
# (Settings → Pages → Source must be "GitHub Actions".)
name: Publish the library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: JebbyCodes/OpenTick
          ref: ${{ vars.OPENTICK_REF || 'main' }}
          path: opentick
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (this refuses to publish if any pack fails the rules)
        env:
          OPENTICK_DIR: ${{ github.workspace }}/opentick
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
