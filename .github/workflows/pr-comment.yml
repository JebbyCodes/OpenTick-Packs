# Puts the two reports on the pull request as comments. The checks themselves run with no write access (a pull request from a fork never gets one),
# so this runs afterwards, from the main branch's copy of this file, and only READS the reports: it never runs anything from the pull request.
# The result that counts is the check on the pull request; the comment is for reading.
name: Comment on pack pull requests
on:
  workflow_run:
    workflows: ['Check packs', 'Performance check']
    types: [completed]
permissions:
  pull-requests: write
  actions: read
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the report
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.workflow_run.name == 'Check packs' && 'validate-report' || 'perf-report' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: report
      - name: Comment
        if: steps.dl.outcome == 'success'
        uses: actions/github-script@v9
        env:
          KIND: ${{ github.event.workflow_run.name == 'Check packs' && 'validate' || 'perf' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require('fs'), kind = process.env.KIND, file = `report/${kind === 'validate' ? 'validate' : 'perf'}.md`;
            if (!fs.existsSync(file)) return;
            const { owner, repo } = context.repo;
            // the pull request is found from the commit, not from anything in the report
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: process.env.HEAD_SHA });
            const pr = prs.data.find(p => p.state === 'open' && p.head.sha === process.env.HEAD_SHA) || prs.data.find(p => p.state === 'open');
            if (!pr) return;
            const marker = `<!-- opentick-packs:${kind} -->`;
            let body = fs.readFileSync(file, 'utf8').slice(0, 60000).replace(/@/g, '@​'); // (no pinging anyone from a pack's text)
            body = `${marker}\n${body}\n\n<sub>Automatic report. The result that counts is the check on this pull request.</sub>`;
            const all = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const mine = all.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
